<!doctype html>
<!--
  MÉTRICA · remake con inicio de sesión (PROTOTIPO VISUAL, un solo archivo, sin dependencias)

  DATOS: viven SOLO en memoria. Al recargar la página se pierde todo (usuarios, proyectos, votos, horas).
  USUARIOS Y CONTRASEÑAS: son SOLO DE DEMOSTRACIÓN. Se guardan en texto plano dentro de este archivo;
  el sistema real no debe hacerlo (la contraseña va con hash). Los usuarios de prueba (Carlos, Ana,
  Candela, Jimena; contraseña demo1234) no existen hasta pulsar "Cargar datos de prueba" en la pantalla de ingreso.

  LO QUE LA API ACTUAL NO PUEDE DAR HOY (marcado con * en la interfaz y con comentarios API-LIMIT en el código):
    - el nombre del Scrum Master y el estado del proyecto en las tarjetas del inicio,
    - la barra de avance por fechas (inicio inclusive: tarjetas del inicio y cronograma del panel),
    - el listado de proyectos filtrado a "mis proyectos" (requiere un endpoint nuevo).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métrica · Remake con inicio de sesión</title>
<style>
  :root {
    /* Paleta: azul marino + teal, con ámbar y verde solo para estados */
    --bg: #f3f5f8; --surface: #ffffff; --ink: #0f1b2d; --muted: #64748b; --line: #e2e8f0; --line-2: #cbd5e1;
    --nav: #0b1626; --nav-ink: #b8c4d6;
    --brand: #0d9488; --brand-dark: #0b7a70; --brand-soft: #dcf3ef; --brand-ink: #0b5f58;
    --amber: #b45309; --amber-soft: #fdf0d5; --ok: #15803d; --ok-soft: #dcf5e4; --slate-soft: #eef2f6; --danger: #e11d48;
    --radius: 14px;
    --shadow: 0 1px 2px rgb(15 27 45 / 5%), 0 10px 28px rgb(15 27 45 / 6%);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* ===== Estructura ===== */
  .shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  .main-col { min-width: 0; }
  .scrim { display: none; }
  .tabbar { display: none; }

  /* ===== Barra lateral ===== */
  .sidebar { background: var(--nav); color: var(--nav-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; align-self: start; }
  .brand-row { padding: 4px 8px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #2dd4bf, #0d9488); display: grid; place-items: center; color: #fff; }
  .logo svg { width: 18px; height: 18px; }
  .nav-label { margin: 18px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6f8099; }
  .nav-item { position: relative; display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--nav-ink); font-weight: 600; font-size: 14px; transition: background .15s, color .15s; }
  .nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
  .nav-item:hover { background: rgb(255 255 255 / 6%); color: #fff; }
  .nav-item.is-active { background: rgb(255 255 255 / 9%); color: #fff; }
  .nav-item.is-active svg { color: #2dd4bf; opacity: 1; }
  .nav-item.is-active::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #2dd4bf; }
  .nav-item:focus-visible, .switcher-btn:focus-visible, .brand:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 2px; }
  .sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 8px 2px; border-top: 1px solid rgb(255 255 255 / 8%); }
  .sidebar-foot strong { display: block; color: #fff; font-size: 13px; line-height: 1.2; }
  .sidebar-foot small { color: #8da0b8; font-size: 12px; }

  /* Selector de proyecto (desplegable) */
  .switcher { position: relative; margin: 8px 0 2px; }
  .switcher-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid rgb(255 255 255 / 10%); background: rgb(255 255 255 / 5%); color: #fff; text-align: left; }
  .switcher-btn:hover { background: rgb(255 255 255 / 9%); }
  .sw-text { min-width: 0; flex: 1; }
  .sw-text strong { display: block; font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw-text small { color: #8da0b8; font-size: 12px; }
  .switcher-btn > svg { width: 16px; height: 16px; flex: none; color: #8da0b8; transition: transform .2s; }
  .switcher.is-open .switcher-btn > svg { transform: rotate(180deg); }
  .switcher-menu { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--ink); border-radius: 12px; box-shadow: 0 18px 40px rgb(0 0 0 / 30%); padding: 6px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .sw-item { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .sw-item:hover { background: var(--slate-soft); }
  .sw-item[aria-current] { background: var(--brand-soft); }
  .sw-item .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-new { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; border-radius: 0 0 8px 8px; color: var(--brand-dark); }
  .sw-new svg { width: 16px; height: 16px; }

  .avatar { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
  .avatar--sm { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
  .avatar--user { border-radius: 50%; background: #1d3557; color: #fff; }
  .av-0 { background: #d3f0ec; color: #0b5f58; } .av-1 { background: #dbe7fb; color: #1e4ba5; } .av-2 { background: #fdecc8; color: #8a4b08; }
  .av-3 { background: #fde0e6; color: #a31d44; } .av-4 { background: #e8e0fb; color: #5b3fb0; }

  /* ===== Barra superior + contenido ===== */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px; background: rgb(243 245 248 / 88%); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.menu-btn { display: none; }
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
  .crumbs a:hover { color: var(--ink); }
  .crumbs svg { width: 14px; height: 14px; flex: none; opacity: .6; }
  .crumbs a, .crumbs .cur { max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs .cur { color: var(--ink); font-weight: 600; }
  .content { max-width: 1180px; width: 100%; margin: 0 auto; padding: 28px 28px 64px; display: grid; gap: 24px; align-content: start; }

  .page-head { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-dark); margin-bottom: 6px; }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.15; letter-spacing: -.025em; font-weight: 800; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ===== Botones ===== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn--primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgb(13 148 136 / 35%); }
  .btn--primary:hover { background: var(--brand-dark); }
  .btn--secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
  .btn--secondary:hover { background: var(--slate-soft); }
  .btn--ghost { background: transparent; color: var(--muted); }
  .btn--ghost:hover { background: var(--slate-soft); color: var(--ink); }
  .btn--outline { background: var(--surface); border-color: var(--brand); color: var(--brand-dark); }
  .btn--outline:hover { background: var(--brand-soft); }
  .btn--sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .link:focus-visible, .pcard:focus-visible, summary:focus-visible, .sw-item:focus-visible, .crumbs a:focus-visible { outline: 3px solid rgb(13 148 136 / 35%); outline-offset: 2px; }

  /* ===== Chips y badges ===== */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--slate-soft); color: #475569; }
  .chip--must { background: var(--ink); color: #fff; }
  .chip--should { background: var(--brand-soft); color: var(--brand-ink); }
  .chip--could { background: var(--slate-soft); color: #64748b; }
  .chip--sp { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: #475569; }
  .chip--none { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: #94a3b8; font-style: italic; }
  .chip--nueva { background: var(--slate-soft); color: #475569; }
  .chip--progreso { background: var(--amber-soft); color: var(--amber); }
  .chip--ok { background: var(--ok-soft); color: var(--ok); }
  .chip--progreso::before, .chip--ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--brand-soft); color: var(--brand-ink); white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge--finalizado { background: var(--ok-soft); color: var(--ok); }
  .badge--planificado { background: var(--slate-soft); color: #475569; }

  /* ===== Tarjetas ===== */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .card h2.heading { font-size: 17px; letter-spacing: -.01em; margin-bottom: 14px; }
  .divider { height: 1px; background: var(--line); margin: 22px 0; }
  .link { color: var(--brand-dark); font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .link svg { width: 15px; height: 15px; }
  .link:hover { text-decoration: underline; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .prose { color: #334155; line-height: 1.7; max-width: 68ch; }
  .vacio, .lane-empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  /* Cronograma */
  .tl-dates { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .tl-dates small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tl-dates strong { font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .tl-dates div:last-child { text-align: right; }
  .track { position: relative; height: 8px; background: var(--slate-soft); border-radius: 999px; }
  .track i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2dd4bf, #0d9488); border-radius: 999px; }
  .track b { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; border: 3px solid var(--brand); box-shadow: 0 1px 4px rgb(0 0 0 / 20%); }
  .card-foot { margin-top: 22px; }

  /* Equipo */
  .team { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .team li { display: flex; align-items: center; gap: 12px; padding: 8px 4px; }
  .team .t { min-width: 0; flex: 1; font-weight: 600; font-size: 14px; }
  .team small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .hint { color: var(--muted); line-height: 1.6; font-size: 14px; }

  /* ===== Formularios ===== */
  .form-grid { display: grid; gap: 16px; }
  .form-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label { font-size: 13px; font-weight: 700; }
  .opt { font-weight: 500; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; min-height: 42px; }
  .field textarea { min-height: 92px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgb(13 148 136 / 18%); outline: none; }
  .error { display: none; font-size: 12.5px; color: var(--danger); }
  .field.invalid .error { display: block; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .form-card { max-width: 720px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }

  /* ===== Inicio: proyectos ===== */
  .list-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search { width: 240px; max-width: 100%; font: inherit; font-size: 14px; padding: 0 12px; height: 40px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgb(13 148 136 / 18%); outline: none; }
  .count { display: inline-block; margin-left: 10px; padding: 1px 10px; border-radius: 999px; background: var(--slate-soft); color: #475569; font-size: 13px; font-weight: 700; vertical-align: middle; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .pcard { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .pcard:hover { transform: translateY(-2px); border-color: #b9c6d6; box-shadow: 0 2px 4px rgb(15 27 45 / 6%), 0 16px 36px rgb(15 27 45 / 10%); }
  .pcard-top { display: flex; justify-content: space-between; align-items: center; }
  .pcard h3 { font-size: 17px; letter-spacing: -.01em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard p { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pcard-meta svg { width: 15px; height: 15px; }
  .pcard-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .pcard.is-new { animation: pop .8s ease; }
  .pcard--new { border: 2px dashed var(--line-2); background: transparent; box-shadow: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); min-height: 220px; gap: 8px; font-weight: 700; }
  .pcard--new svg { width: 26px; height: 26px; }
  .pcard--new:hover { border-color: var(--brand); color: var(--brand-dark); background: var(--brand-soft); transform: none; box-shadow: none; }
  @keyframes pop { 0% { box-shadow: 0 0 0 0 rgb(13 148 136 / 45%); } 100% { box-shadow: 0 0 0 14px rgb(13 148 136 / 0%); } }

  /* ===== Backlog ===== */
  .stack { display: grid; gap: 14px; list-style: none; margin: 0; padding: 0; }
  .story { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 12px; }
  .story--must { border-left-color: var(--ink); } .story--should { border-left-color: var(--brand); } .story--could { border-left-color: #94a3b8; }
  .story-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .story-title { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  .story-id { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .story h2 { font-size: 17px; letter-spacing: -.01em; line-height: 1.35; overflow-wrap: anywhere; }
  .story-desc { color: #334155; line-height: 1.6; }
  .criteria { border-top: 1px dashed var(--line-2); padding-top: 12px; }
  .criteria h3 { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .criteria .empty { color: #94a3b8; font-style: italic; font-size: 14px; }
  .inline-panel { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
  .inline-panel h3 { font-size: 15px; letter-spacing: -.01em; }
  .panel-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ===== Sprints / Estado ===== */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .lane { background: rgb(15 27 45 / 3.5%); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 12px; align-content: start; }
  .lane-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: #475569; }
  .lane-head::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
  .lane--activo .lane-head { color: var(--brand-ink); } .lane--activo .lane-head::before { background: var(--brand); }
  .lane--fin .lane-head { color: var(--ok); } .lane--fin .lane-head::before { background: var(--ok); }
  .lane-head .chips { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .lane-empty { padding: 20px 14px; background: transparent; }
  .scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }
  .scard h3 { font-size: 16px; letter-spacing: -.01em; }
  .goal { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .dates { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 2px 9px; border-radius: 7px; background: var(--slate-soft); color: #475569; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dates svg { width: 13px; height: 13px; }
  .mini-list { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; background: #fbfcfd; }
  .mini-title { font-weight: 700; font-size: 14px; line-height: 1.35; }
  .mini-foot { display: flex; justify-content: flex-end; }
  .mini-note { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .scard-foot { border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: flex-end; }
  .history { display: grid; gap: 10px; }
  details.sdone { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  details.sdone summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: start; }
  details.sdone summary::-webkit-details-marker { display: none; }
  details.sdone summary:hover { background: #fbfcfd; }
  details.sdone h3 { font-size: 15.5px; letter-spacing: -.01em; }
  details.sdone .goal { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sd-chips { grid-column: 1 / -1; }
  .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; margin-top: 3px; }
  details[open].sdone .chev { transform: rotate(180deg); }
  details[open].sdone summary { border-bottom: 1px solid var(--line); }
  .done-list { list-style: none; margin: 0; padding: 4px 16px 8px; }
  .done-list > li { padding: 12px 0; display: grid; gap: 6px; }
  .done-list > li + li { border-top: 1px solid var(--line); }
  .done-title { font-weight: 700; font-size: 13.5px; line-height: 1.35; }

          <button type="button" class="icon-btn" data-action="close-overlay" aria-label="Cerrar">${icon('x')}</button></div>
        <form data-form="create-project" novalidate>
          <div class="form-grid">
            <div class="field" id="f-nombre"><label for="c-nombre">Nombre del proyecto</label><input id="c-nombre" maxlength="120" autocomplete="off"><p class="error">Ingresá un nombre para el proyecto.</p></div>
            <div class="field"><label for="c-desc">Descripción <span class="opt">(opcional)</span></label><textarea id="c-desc" maxlength="400"></textarea></div>
            <div class="form-grid form-grid--2">
              <div class="field" id="f-inicio"><label for="c-inicio">Fecha de inicio</label><input id="c-inicio" type="date"><p class="error">Elegí la fecha de inicio.</p></div>
              <div class="field" id="f-fin"><label for="c-fin">Fecha de fin</label><input id="c-fin" type="date"><p class="error">Elegí la fecha de fin.</p></div>
            </div>
            <p class="hint">Vas a quedar como <strong>Scrum Master</strong> del proyecto (<strong>${esc(session.usuario)}</strong>).</p>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Crear proyecto</button>
              <button type="button" class="btn btn--ghost" data-action="close-overlay">Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>`;
  }

  // ---------- Panel del proyecto ----------
  const listaEquipo = (eq) => eq.length ? `<ul class="team">${eq.map((m, i) => `<li>${avatar(m.usuario, i + 1)}<span class="t">${esc(m.usuario)}<br><small>${ROLES[m.rol]}</small></span></li>`).join('')}</ul>` : '<p class="hint">Todavía no hay integrantes asignados.</p>';

  function viewPanel(r) {
    const p = proyecto(r.id), eq = DB.team[p.id] || [], pr = progreso(p), sm = esSM(p.id);
    const cer = !!p.cerrado;
    // Cerrado: el Scrum Master conserva "Editar proyecto" porque ahí están Reabrir y Eliminar (el formulario queda de solo lectura).
    const acciones = sm
      ? (cer ? `<button type="button" class="btn btn--secondary" disabled aria-describedby="nota-rol">${icon('users')}Configurar equipo</button><a class="btn btn--secondary" href="#/projects/${p.id}/edit">${icon('edit')}Editar proyecto</a><button type="button" class="btn btn--primary" data-action="reabrir">Reabrir proyecto</button>`
        : `<a class="btn btn--secondary" href="#/projects/${p.id}/settings">${icon('users')}Configurar equipo</a><a class="btn btn--primary" href="#/projects/${p.id}/edit">${icon('edit')}Editar proyecto</a>`)
      : `<button type="button" class="btn btn--secondary" disabled aria-describedby="nota-rol">${icon('users')}Configurar equipo</button><button type="button" class="btn btn--primary" disabled aria-describedby="nota-rol">${icon('edit')}Editar proyecto</button>`;
    return pageHead({
      kicker: `Panel del proyecto · #${p.id}`, title: p.nombre, badgeHtml: badge(p), actions: acciones, sub: cer ? `Cerrado el ${fmt(p.cerrado)}` : '',
      nota: cer ? notaCerrado(sm) : sm ? '' : 'Solo el Scrum Master puede editar el proyecto y configurar el equipo.'
    }) + `
    <div class="grid-2">
      <article class="card">
        <h2 class="card-title">Descripción</h2>
        <p class="prose">${esc(p.descripcion || 'Sin descripción')}</p>
        <div class="divider"></div>
        <h2 class="card-title">Cronograma</h2>
        <div class="tl-dates"><div><small>Inicio</small><strong>${fmt(p.inicio)}</strong></div><div><small>Fin</small><strong>${fmt(p.fin)}</strong></div></div>
        <!-- API-LIMIT: la barra de avance por fechas no la entrega la API actual -->
        <div class="track" role="img" aria-label="Avance ${pr}%"><i style="width:${pr}%"></i><b style="left:${pr}%"></b></div>
        <p class="api-foot"><span class="api-mark">*</span> Barra de avance por fechas: dato que la API actual no entrega.</p>
        <div class="card-foot"><a class="link" href="#/projects/${p.id}/status">Ver estado del proyecto ${icon('arr')}</a></div>
      </article>
      <aside class="card">
        <h2 class="card-title">Equipo</h2>
        ${listaEquipo(eq)}
        <div class="card-foot"><a class="link" href="#/projects/${p.id}/settings">${sm ? 'Configurar equipo' : 'Ver equipo'} ${icon('arr')}</a></div>
      </aside>
    </div>`;
  }

  function viewEditar(r) { // solo llega el Scrum Master (parse() manda al resto a "No tenés permiso")
    const p = proyecto(r.id), cer = !!p.cerrado;
    return pageHead({ kicker: `Proyecto #${p.id}`, title: 'Editar proyecto', actions: `<a class="btn btn--ghost" href="#/projects/${p.id}/proyecto">${icon('back')}Volver al panel</a>`,
      nota: cer ? notaCerrado(true) : '' }) + `
    <form class="card form-card" data-form="edit-project" novalidate>
      <fieldset class="form-grid"${cer ? ' disabled aria-describedby="nota-rol"' : ''}>
        <div class="field" id="f-nombre"><label for="e-nombre">Nombre del proyecto</label><input id="e-nombre" maxlength="120" value="${esc(p.nombre)}"><p class="error">Ingresá un nombre para el proyecto.</p></div>
        <div class="field"><label for="e-desc">Descripción <span class="opt">(opcional)</span></label><textarea id="e-desc" maxlength="400">${esc(p.descripcion)}</textarea></div>
        <div class="form-grid form-grid--2">
          <div class="field" id="f-inicio"><label for="e-inicio">Fecha de inicio</label><input id="e-inicio" type="date" value="${p.inicio}"><p class="error">Elegí la fecha de inicio.</p></div>
          <div class="field" id="f-fin"><label for="e-fin">Fecha de fin</label><input id="e-fin" type="date" value="${p.fin}"><p class="error">Elegí la fecha de fin.</p></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn btn--primary">Guardar cambios</button><a class="btn btn--ghost" href="#/projects/${p.id}/proyecto">Cancelar</a></div>
      </fieldset>
    </form>
    <section class="zona" aria-labelledby="z-cerrar">
      <h2 id="z-cerrar">Cerrar proyecto</h2>
      ${cer
        ? `<p>El proyecto se cerró el ${fmt(p.cerrado)} y está en estado Finalizado, de solo lectura.</p><div><button type="button" class="btn btn--outline" data-action="reabrir">Reabrir proyecto</button></div>`
        : '<p>Deja el proyecto en estado Finalizado, con la fecha de cierre de hoy, y de solo lectura. Después podés reabrirlo.</p><div><button type="button" class="btn btn--secondary" data-action="dlg-cerrar">Cerrar proyecto</button></div>'}
    </section>
    <section class="zona zona--peligro" aria-labelledby="z-peligro">
      <h2 id="z-peligro">Zona de peligro</h2>
      <p>Eliminar el proyecto borra el proyecto con todo lo que contiene. No se puede deshacer.</p>
      <div><button type="button" class="btn btn--danger-outline" data-action="dlg-eliminar">Eliminar proyecto</button></div>
    </section>`;
  }

  function viewEquipo(r) {
    const p = proyecto(r.id), eq = DB.team[p.id] || [], sm = esSM(p.id), cer = !!p.cerrado, edit = sm && !cer;
    // Solo se pueden agregar usuarios YA registrados que todavía no forman parte del proyecto (quien se quita vuelve a estar disponible).
    const disponibles = DB.users.filter((u) => !miembro(p.id, u.usuario));
    // El Scrum Master es fijo: no tiene botón "Quitar" ni puede quitarse a sí mismo.
    const quitar = (m) => m.rol === 'scrum_master' ? ''
      : `<button type="button" class="btn btn--outline btn--sm" aria-label="Quitar a ${esc(m.usuario)} del proyecto"${edit ? ` data-action="dlg-quitar" data-user="${esc(m.usuario)}"` : ' disabled aria-describedby="nota-rol"'}>Quitar</button>`;
    const lista = `<ul class="team">${eq.map((m, i) => `<li>${avatar(m.usuario, i + 1)}<span class="t">${esc(m.usuario)}<br><small>${ROLES[m.rol]}${m.rol === 'scrum_master' ? ' · fijo' : ''}</small></span>${quitar(m)}</li>`).join('')}</ul>`;
    return pageHead({ kicker: `Proyecto #${p.id}`, title: 'Configurar equipo', actions: `<a class="btn btn--ghost" href="#/projects/${p.id}/proyecto">${icon('back')}Volver al panel</a>`,
      nota: cer ? notaCerrado(sm) : sm ? '' : 'Solo el Scrum Master puede configurar el equipo y quitar integrantes.' }) + `
    <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <article class="card"><h2 class="heading">Asignar integrante</h2>
        <form data-form="team" novalidate>
          <fieldset class="form-grid"${edit ? '' : ' disabled aria-describedby="nota-rol"'}>
            <div class="field" id="f-m-user"><label for="m-user">Usuario</label>
              <select id="m-user"${disponibles.length ? '' : ' disabled'}><option value="">${disponibles.length ? 'Elegí un usuario' : 'No hay usuarios para agregar'}</option>${disponibles.map((u) => `<option value="${esc(u.usuario)}">${esc(u.usuario)}</option>`).join('')}</select>
              <p class="error">Elegí un usuario.</p></div>
            ${disponibles.length ? '' : '<p class="aviso">No hay usuarios registrados que todavía no sean parte del proyecto.</p>'}
            <div class="field"><span class="lbl-fijo" style="font-size:13px;font-weight:700">Rol</span>
              <p class="rol-fijo"><span class="chip chip--should">Product Builder</span></p>
              <p class="help">El proyecto tiene un solo Scrum Master (quien lo creó): el único rol que se puede asignar es Product Builder.</p></div>
            <div><button type="submit" class="btn btn--primary"${disponibles.length ? '' : ' disabled'}>Asignar</button></div>
          </fieldset>
        </form></article>
      <article class="card"><h2 class="heading">Equipo del proyecto</h2>${lista}</article>
    </div>`;
  }

  // ---------- Historias ----------
  function viewBacklog(r) {
    const hist = DB.stories[r.id] || [];
    const cer = cerrado(r.id), bloq = ' disabled aria-describedby="nota-rol"';
    const disp = (DB.sprints[r.id] || []).filter((s) => s.estado !== 'finalizado');
    const panelEditar = (h) => `
      <form class="inline-panel" data-form="edit-story" data-story="${h.id}" novalidate>
        <h3>Editar historia</h3>
        <div class="form-grid">
          <div class="field" id="f-hist"><label for="x-t">Título</label><input id="x-t" value="${esc(h.titulo)}"><p class="error">El título es obligatorio.</p></div>
          <div class="field"><label for="x-d">Descripción</label><textarea id="x-d">${esc(h.descripcion)}</textarea></div>
          <div class="field"><label for="x-c">Criterios de aceptación</label><textarea id="x-c">${esc(h.criterios)}</textarea></div>
          <div class="field" style="max-width:14rem"><label for="x-sp">Story Points</label>
            <select id="x-sp"><option value="">Sin estimar</option>${[1, 2, 3, 5, 8, 13, 21].map((n) => `<option${h.sp === n ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        </div>
        <div class="panel-actions"><button type="button" class="btn btn--ghost" data-action="close-panel">Cancelar</button><button type="submit" class="btn btn--primary">Guardar cambios</button></div>
      </form>`;
    const panelAsignar = (h) => `
      <form class="inline-panel" data-form="assign" data-story="${h.id}" novalidate>
        <h3>Asignar a Sprint</h3>
        <div class="field"><label for="a-sprint">Sprint</label>
          <select id="a-sprint"${disp.length ? '' : ' disabled'}>${disp.length ? '<option value="">Elegí un Sprint</option>' + disp.map((s) => `<option value="${s.numero}">Sprint ${s.numero} (${s.estado})</option>`).join('') : '<option>No hay Sprints disponibles</option>'}</select>
          <p class="error">Elegí un Sprint.</p></div>
        <div class="panel-actions"><button type="button" class="btn btn--ghost" data-action="close-panel">Cancelar</button><button type="submit" class="btn btn--primary"${disp.length ? '' : ' disabled'}>Confirmar asignación</button></div>
      </form>`;
    const tarjeta = (h) => `
      <li class="story story--${SLUG[h.prioridad]}">
        <div class="story-top">
          <div class="story-title"><span class="story-id">#${h.id}</span><h2>${esc(h.titulo)}</h2></div>
          <div class="actions">
            <button type="button" class="btn btn--secondary btn--sm" data-action="open-edit" data-story="${h.id}"${cer ? bloq : ''}>${icon('edit')}Editar</button>
            <button type="button" class="btn btn--secondary btn--sm" data-action="open-assign" data-story="${h.id}"${cer ? bloq : ''}>Asignar a Sprint</button>
            <a class="btn btn--outline btn--sm" href="#/projects/${r.id}/votacion/${h.id}">Votar</a>
          </div>
        </div>
        <ul class="chips">${priChip(h.prioridad)}${estChip('Nueva')}${spChip(h.sp, true)}${h.valor != null ? `<li class="chip chip--sp">Valor de negocio: ${h.valor}</li>` : ''}</ul>
        <p class="story-desc">${esc(h.descripcion || 'Sin descripción')}</p>
        <div class="criteria"><h3>Criterios de aceptación</h3>${h.criterios ? `<p>${esc(h.criterios)}</p>` : '<p class="empty">Sin criterios de aceptación</p>'}</div>
        ${ui.panel && ui.panel.story === h.id ? (ui.panel.type === 'edit' ? panelEditar(h) : panelAsignar(h)) : ''}
      </li>`;
    return pageHead({ kicker: `Proyecto #${r.id}`, title: 'Product Backlog', sub: `${hist.length} ${hist.length === 1 ? 'historia' : 'historias'} sin Sprint`,
      actions: cer ? `<button type="button" class="btn btn--primary"${bloq}>${icon('plus')}Nueva historia</button>` : `<a class="btn btn--primary" href="#/projects/${r.id}/backlog/nueva">${icon('plus')}Nueva historia</a>`,
      nota: cer ? notaCerrado(esSM(r.id)) : '' }) +
      (hist.length ? `<ul class="stack">${hist.map(tarjeta).join('')}</ul>` : '<div class="vacio">Todavía no hay historias en el backlog.</div>');
  }

  function overlayNuevaHistoria(r) {
    return `
    <div class="overlay overlay--right" data-overlay>
      <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
        <div class="ov-head"><div><h2 id="d-title">Nueva historia</h2><p class="sub">Se agrega al Product Backlog del proyecto #${r.id}.</p></div>
          <button type="button" class="icon-btn" data-action="close-overlay" aria-label="Cerrar">${icon('x')}</button></div>
        <form data-form="new-story" novalidate>
          <fieldset class="form-grid">
            <div class="field" id="f-hist"><label for="n-t">Título</label><input id="n-t" maxlength="200" autocomplete="off"><p class="error">Ingresá un título para la historia.</p></div>
            <div class="field"><label for="n-d">Descripción</label><textarea id="n-d"></textarea></div>
            <div class="field"><label for="n-c">Criterios de aceptación</label><textarea id="n-c"></textarea></div>
            <div class="form-grid form-grid--2">
              <div class="field"><label for="n-p">Prioridad</label><select id="n-p"><option>Must have</option><option>Should have</option><option>Could have</option><option>Won't have</option></select></div>
              <div class="field"><label for="n-v">Valor de negocio</label><select id="n-v"><option value="">Sin valor</option>${[1, 2, 3, 5, 8, 13, 21].map((n) => `<option>${n}</option>`).join('')}</select></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn--primary">Guardar</button><button type="button" class="btn btn--ghost" data-action="close-overlay">Cancelar</button></div>
          </fieldset>
        </form>
      </div>
    </div>`;
  }

  // ---------- Sprints ----------
  const miniBase = (h, extra) => `<li class="mini"><p class="mini-title">${esc(h.titulo)}</p><ul class="chips">${priChip(h.prioridad, true)}${estChip(h.estado)}${spChip(h.sp)}</ul>${extra || ''}</li>`;
  const rango = (s) => `<span class="dates">${icon('cal')}${fmt(s.inicio)} → ${fmt(s.fin)}</span>`;

  function viewSprints(r) {
    const lista = DB.sprints[r.id] || [];
    const sm = esSM(r.id);
    const cer = cerrado(r.id);
    const dis = sm && !cer ? '' : ' disabled aria-describedby="nota-rol"'; // Product Builder: ve las acciones deshabilitadas
    const pend = lista.filter((s) => s.estado === 'pendiente').sort((a, b) => a.numero - b.numero);
    const act = lista.filter((s) => s.estado === 'activo');
    const fin = lista.filter((s) => s.estado === 'finalizado').sort((a, b) => b.numero - a.numero);
    const vacio = '<div class="lane-empty">No hay Sprints</div>';

    const panelHoras = (h) => `
      <form class="inline-panel" data-form="hours" data-story="${h.id}" novalidate>
        <h3>Registrar horas</h3>
        <p class="hint">Se registra a nombre de <strong>${esc(session.usuario)}</strong>.</p>
        <div class="form-grid">
          <div class="field" id="f-h-fecha"><label for="h-fecha">Fecha</label><input id="h-fecha" type="date" value="${hoyISO()}"><p class="error">Elegí la fecha.</p></div>
          <div class="field" id="f-h-act"><label for="h-act">Actividad</label><input id="h-act" maxlength="200" autocomplete="off"><p class="error">Ingresá la actividad.</p></div>
          <div class="field" id="f-h-horas"><label for="h-horas">Horas</label><input id="h-horas" type="number" min="0" step="any" inputmode="decimal"><p class="error">Ingresá las horas (un número mayor que 0).</p></div>
        </div>
        <div class="panel-actions"><button type="button" class="btn btn--ghost" data-action="close-panel">Cancelar</button><button type="submit" class="btn btn--primary">Registrar</button></div>
      </form>`;

    const cardPend = (s) => `
      <article class="scard">
        <h3>Sprint ${s.numero}</h3>
        ${s.stories.length ? `<ul class="mini-list">${s.stories.map((h) => miniBase(h)).join('')}</ul>` : ''}
        <form class="inline-panel" data-form="start-sprint" novalidate>
          <fieldset class="form-grid"${dis}>
            <h3>Iniciar Sprint</h3>
            <div class="field"><label for="g-${s.numero}">Sprint Goal</label><input id="g-${s.numero}"></div>
            <div class="form-grid">
              <div class="field"><label for="i-${s.numero}">Fecha de inicio</label><input id="i-${s.numero}" type="date"></div>
              <div class="field"><label for="f-${s.numero}">Fecha de fin</label><input id="f-${s.numero}" type="date"></div>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Iniciar Sprint</button>
          </fieldset>
        </form>
      </article>`;

    const cardAct = (s) => `
      <article class="scard">
        <div><h3>Sprint ${s.numero}</h3>${s.goal ? `<p class="goal">${esc(s.goal)}</p>` : ''}${rango(s)}</div>
        ${s.stories.length ? `<ul class="mini-list">${s.stories.map((h) => {
          const b = h.estado === 'Nueva' ? ['Iniciar', 'play'] : h.estado === 'En progreso' ? ['Completar', 'check'] : null;
          const abierto = !!(ui.panel && ui.panel.type === 'horas' && ui.panel.story === h.id);
          return miniBase(h, `
            <p class="horas-total">Esfuerzo real: ${fmtH(totalHoras(r.id, h.id))} h</p>
            ${h.estado === 'Completada' ? `<span class="mini-note">Completada el ${fmt(h.fecha)}</span>` : ''}
            <div class="mini-foot"><button type="button" class="btn btn--secondary btn--sm" data-action="open-horas" data-story="${h.id}" aria-expanded="${abierto}"${cer ? dis : ''}>${icon('clock')}Registrar horas</button>${b
              ? `<button type="button" class="btn btn--outline btn--sm story-action" data-action="story-next" data-sprint="${s.numero}" data-story="${h.id}"${cer ? dis : ''}>${icon(b[1])}${b[0]}</button>` : ''}</div>
            ${abierto ? panelHoras(h) : ''}`);
        }).join('')}</ul>` : '<p class="goal">Sin historias asignadas.</p>'}
        <div class="scard-foot"><button type="button" class="btn btn--primary" data-action="close-sprint" data-sprint="${s.numero}"${dis}>Cerrar Sprint</button></div>
      </article>`;

    const cardFin = (s) => {
      const ok = s.stories.filter((h) => h.estado === 'Completada'), sp = ok.reduce((t, h) => t + (h.sp || 0), 0);
      return `
      <details class="sdone">
        <summary>
          <div><h3>Sprint ${s.numero}</h3>${s.goal ? `<p class="goal">${esc(s.goal)}</p>` : ''}${rango(s)}</div>
          <span class="chev">${icon('chevd')}</span>
          <ul class="chips sd-chips"><li class="chip ${ok.length ? 'chip--ok' : 'chip--nueva'}">${ok.length} completada${ok.length === 1 ? '' : 's'}</li><li class="chip chip--sp">${sp} SP</li></ul>
        </summary>
        <ul class="done-list">${s.stories.map((h) => `
          <li><p class="done-title">${esc(h.titulo)}</p>
            <ul class="chips">${priChip(h.prioridad, true)}${spChip(h.sp)}${h.estado !== 'Completada' ? estChip(h.estado) : ''}</ul>
            ${h.estado === 'Completada' ? `<span class="mini-note">Completada el ${fmt(h.fecha)}</span>` : ''}
            ${totalHoras(r.id, h.id) > 0 ? `<span class="horas-total">Esfuerzo real: ${fmtH(totalHoras(r.id, h.id))} h</span>` : ''}</li>`).join('') || '<li><p class="mini-note">Sin historias.</p></li>'}</ul>
      </details>`;
    };

    return pageHead({ kicker: `Proyecto #${r.id}`, title: 'Sprints',
      actions: `<button type="button" class="btn btn--primary" data-action="create-sprint"${dis}>${icon('plus')}Crear Sprint</button>`,
      nota: cer ? notaCerrado(sm) : sm ? '' : 'Solo el Scrum Master puede crear, iniciar y cerrar un Sprint.' }) + `
    <div class="board">
      <section class="lane"><h2 class="lane-head">Pendiente</h2>${pend.length ? pend.map(cardPend).join('') : vacio}</section>
      <section class="lane lane--activo"><h2 class="lane-head">Activo</h2>${act.length ? act.map(cardAct).join('') : vacio}</section>
      <section class="lane lane--fin"><h2 class="lane-head">Finalizado</h2>${fin.length ? `<div class="history">${fin.map(cardFin).join('')}</div>` : vacio}</section>
    </div>`;
  }

  // ---------- Estado (HU-18) ----------
  function viewEstado(r) {
    const p = proyecto(r.id), items = [];
    (DB.sprints[r.id] || []).slice().sort((x, y) => y.numero - x.numero).forEach((sp) =>
      sp.stories.forEach((h) => items.push({ titulo: h.titulo, prioridad: h.prioridad, sp: h.sp, estado: h.estado, sprint: sp.numero })));
    (DB.stories[r.id] || []).forEach((h) => items.push({ titulo: h.titulo, prioridad: h.prioridad, sp: h.sp, estado: 'Nueva', sprint: null }));
    const color = { 'Nueva': '#cbd5e1', 'En progreso': '#0d9488', 'Completada': '#16a34a' };
    const grupos = [['Nueva', ''], ['En progreso', ' lane--activo'], ['Completada', ' lane--fin']].map(([nombre, cls]) => {
      const lista = items.filter((i) => i.estado === nombre);
      return { nombre, cls, lista, sp: lista.reduce((t, i) => t + (i.sp || 0), 0) };
    });
    const total = items.length, totalSp = items.reduce((t, i) => t + (i.sp || 0), 0);
    const n = (c, uno, varios) => `${c} ${c === 1 ? uno : varios}`;
    const columna = (g) => `
      <section class="lane${g.cls}">
        <h2 class="lane-head">${g.nombre}<ul class="chips"><li class="chip chip--sp">${n(g.lista.length, 'historia', 'historias')}</li><li class="chip chip--sp">${g.sp} SP</li></ul></h2>
        ${g.lista.length ? g.lista.map((i) => `
          <div class="mini"><p class="mini-title">${esc(i.titulo)}</p>
            <ul class="chips">${priChip(i.prioridad, true)}${spChip(i.sp)}</ul>
            <span class="stag${i.sprint ? '' : ' stag--backlog'}">${i.sprint ? 'Sprint ' + i.sprint : 'Product Backlog'}</span></div>`).join('') : '<div class="lane-empty">Sin historias</div>'}
      </section>`;
    return pageHead({ kicker: `Proyecto #${r.id}`, title: 'Estado del proyecto', badgeHtml: badge(p) }) + `
    <article class="card summary">
      <div class="totals"><div><span class="big">${total}</span><span class="lbl">${total === 1 ? 'Historia' : 'Historias'}</span></div><div><span class="big">${totalSp}</span><span class="lbl">Story Points</span></div></div>
      <div class="stack-bar" role="img" aria-label="${grupos.map((g) => `${g.nombre}: ${g.lista.length}`).join(', ')}">${grupos.map((g) => g.lista.length ? `<i style="flex:${g.lista.length};background:${color[g.nombre]}" title="${g.nombre}: ${g.lista.length}"></i>` : '').join('')}</div>
    </article>` + (total ? `<div class="board">${grupos.map(columna).join('')}</div>` : '<div class="vacio">Este proyecto todavía no tiene historias.</div>');
  }

  // ---------- Cuenta: iniciar sesión / crear cuenta (solo nombre de usuario y contraseña) ----------
  const pwField = (id, fid, label, auto, extra, msg) => `
    <div class="field" id="${fid}"><label for="${id}">${label}</label>
      <div class="pw"><input id="${id}" type="password" autocomplete="${auto}" maxlength="100"><button type="button" data-action="toggle-pw" aria-label="Mostrar contraseña">${icon('eye')}</button></div>
      ${extra || ''}<p class="error">${msg || 'Ingresá tu contraseña.'}</p></div>`;

  function viewAuth(r) {
    const hero = `
      <section class="auth-hero">
        <a class="brand" href="#/login"><span class="logo">${icon('logo')}</span>Métrica</a>
        <div><h2>Seguimiento Scrum, claro y al día.</h2><p class="lead">Product Backlog, Sprints y estado del proyecto en un solo lugar para todo el equipo.</p></div>
        <ul class="auth-points">
          <li><span class="ic">${icon('list')}</span>Historias priorizadas con Story Points</li>
          <li><span class="ic">${icon('flag')}</span>Sprints pendientes, activos y finalizados</li>
          <li><span class="ic">${icon('users')}</span>Equipo con roles: Scrum Master y Product Builder</li>

        <p class="auth-foot">Prototipo visual · UTN FRSR</p>

    if (r.name === 'login') return hero + `
      <main class="auth-main"><div class="auth-card">
        <div><p class="kicker">Bienvenido</p><h1>Iniciar sesión</h1><p class="sub">Ingresá con tu cuenta para ver tus proyectos.</p></div>
        ${ui.expired ? '<div class="auth-alert auth-alert--warn" role="alert">Tu sesión venció. Volvé a ingresar para continuar.</div>' : ''}
        <div class="auth-alert" id="auth-alert" role="alert" hidden>Usuario o contraseña incorrectos</div>
        <form data-form="login" novalidate class="form-grid">
          <div class="field" id="f-l-user"><label for="l-user">Nombre de usuario</label><input id="l-user" autocomplete="username" maxlength="60"><p class="error">Ingresá tu nombre de usuario.</p></div>
          ${pwField('l-pass', 'f-l-pass', 'Contraseña', 'current-password')}
          <button type="submit" class="btn btn--primary btn--block">Iniciar sesión</button>
        </form>
        <p class="auth-switch">¿Todavía no tenés cuenta? <a class="link" href="#/register">Crear cuenta</a></p>
        <section class="demo-card" aria-labelledby="demo-t">
          <h2 id="demo-t">Datos de prueba <span class="proto-tag">Solo del prototipo</span></h2>

          <table class="demo-table"><thead><tr><th scope="col">Usuario</th><th scope="col">Contraseña</th><th scope="col">Rol</th></tr></thead><tbody>
            ${DEMO_USUARIOS.map(([n, rol]) => `<tr><td><code>${n}</code></td><td><code>${DEMO_PASS}</code></td><td>${rol}${DB.demoCargado ? `<br><button type="button" class="btn btn--secondary btn--sm" data-action="use-demo" data-user="${n}">Usar</button>` : ''}</td></tr>`).join('')}
          </tbody></table>
          <div class="auth-alert" id="demo-aviso" role="alert" hidden></div>
          <button type="button" class="btn btn--secondary" data-action="load-demo"${DB.demoCargado ? ' disabled' : ''}>${DB.demoCargado ? 'Datos de prueba cargados' : 'Cargar datos de prueba'}</button>
        </section>
      </div></main>`;
    return hero + `
      <main class="auth-main"><div class="auth-card">
        <div><p class="kicker">Nueva cuenta</p><h1>Crear cuenta</h1><p class="sub">Elegí un nombre de usuario y una contraseña. Con tu cuenta vas a poder crear proyectos y sumarte a equipos.</p></div>
        <form data-form="register" novalidate class="form-grid">
          <div class="field" id="f-r-user"><label for="r-user">Nombre de usuario</label><input id="r-user" autocomplete="username" maxlength="60"><p class="error">Ingresá un nombre de usuario.</p></div>
          ${pwField('r-pass', 'f-r-pass', 'Contraseña', 'new-password', '<p class="help">Mínimo 8 caracteres.</p>', 'La contraseña debe tener al menos 8 caracteres.')}
          ${pwField('r-pass2', 'f-r-pass2', 'Repetir contraseña', 'new-password', '', 'Repetí la contraseña.')}
          <button type="submit" class="btn btn--primary btn--block">Crear cuenta</button>
        </form>
        <p class="auth-switch">¿Ya tenés cuenta? <a class="link" href="#/login">Iniciar sesión</a></p>

  }

  // Tras iniciar sesión o registrarse: vuelve a la ruta anterior si la sesión había vencido; si no, al inicio.
  function entrar(u, mensaje) {
    const destino = ui.volverA || '#/projects'; ui.volverA = null; ui.expired = false;
    session = u; navigate(destino); toast(mensaje);
  }
  function doLogin() {
    const user = val('l-user'), pass = $('l-pass').value;
    setInvalid('f-l-user', !user); setInvalid('f-l-pass', !pass, 'Ingresá tu contraseña.');
    if (!user || !pass) return;
    const u = DB.users.find((x) => mismo(x.usuario, user) && x.pass === pass);
    if (!u) { $('auth-alert').hidden = false; return; }
    entrar(u, `Hola de nuevo, ${u.usuario}`);
  }
  function doRegister() {
    const user = val('r-user'), p1 = $('r-pass').value, p2 = $('r-pass2').value;
    const dup = !!user && DB.users.some((x) => mismo(x.usuario, user));
    setInvalid('f-r-user', !user || dup, dup ? 'Ese nombre de usuario ya existe' : 'Ingresá un nombre de usuario.');
    setInvalid('f-r-pass', p1.length < 8, 'La contraseña debe tener al menos 8 caracteres.');
    setInvalid('f-r-pass2', !p2 || p1 !== p2, p2 ? 'Las contraseñas no coinciden.' : 'Repetí la contraseña.');
    if (!user || dup || p1.length < 8 || !p2 || p1 !== p2) return;
    const u = { usuario: user, pass: p1 }; DB.users.push(u);
    entrar(u, `Cuenta creada. ¡Bienvenido, ${user}!`);
  }
  function doLogout() { session = null; ui.expired = false; ui.volverA = null; navigate('#/login'); toast('Sesión cerrada'); }

  // ---------- Planning Poker (textos, estados y reglas copiados de la pantalla real; el estilo es del remake) ----------
  const CARTAS = [1, 2, 3, 5, 8, 13, 21];
  // La regla exacta de la "carta sugerida" la define el backend (spec 012), que no está en los adjuntos:
  // acá es la carta más cercana al promedio exacto (si hay empate, la mayor). Supuesto del prototipo.
  const cartaSugerida = (prom) => CARTAS.reduce((best, c) => (Math.abs(c - prom) <= Math.abs(best - prom) ? c : best), CARTAS[0]);
  function buscarHistoria(pid, hid) {
    const b = (DB.stories[pid] || []).find((x) => x.id === hid);
    if (b) return { tipo: 'backlog', h: b };
    for (const s of DB.sprints[pid] || []) { const x = s.stories.find((y) => y.id === hid); if (x) return { tipo: 'sprint', h: x }; }
    return null;
  }
  function viewVotacion(r) {
    const pid = r.id, hid = r.hid, me = session.usuario, sm = esSM(pid), eq = DB.team[pid] || [], cer = cerrado(pid);
    const found = buscarHistoria(pid, hid);
    const hist = found && found.tipo === 'backlog' ? found.h : null; // como la pantalla real: el resumen sale del listado del Product Backlog
    const v = (DB.votaciones[pid] || {})[hid] || null;
    const cabecera = pageHead({ kicker: 'Planning Poker', title: `Votación de la historia #${hid}`, sub: `Proyecto actual: <strong>${pid}</strong>`,
      actions: `<a class="btn btn--ghost" href="#/projects/${pid}/backlog">Volver al Product Backlog</a><button type="button" class="btn btn--secondary" data-action="poker-refresh">Actualizar</button>` });
    const resumen = hist
      ? `<article class="pk-historia" aria-labelledby="pk-h-t"><p class="pk-num">Historia #${hist.id}</p><h2 id="pk-h-t">${esc(hist.titulo)}</h2>
          <p class="pk-datos"><span>${esc(hist.prioridad)}</span><span>${hist.sp == null ? 'Sin estimar' : `${hist.sp} SP`}</span></p><p class="pk-desc">${esc(hist.descripcion)}</p></article>`
      : `<p class="pk-num">Historia #${hid}</p>`;
    if (!found) return `<section class="pk">${cabecera}${resumen}<p class="nota-rol">${icon('info')}La historia #${hid} no existe en este proyecto.</p></section>`;

    let cuerpo = '';
    if (!v) {
      cuerpo = `<div class="pk-acciones"><p>La historia todavía no tiene votación</p>${sm && !cer
        ? '<button type="button" class="btn btn--primary" data-action="poker-start">Iniciar votación</button>'
        : `<button type="button" class="btn btn--primary" disabled aria-describedby="pk-nota-ini">Iniciar votación</button><p class="nota-rol nota-rol--inline" id="pk-nota-ini">${icon('lock')}${cer ? 'Proyecto cerrado' : 'Solo el Scrum Master puede iniciar la votación'}</p>`}</div>`;
    } else {
      const filas = eq.map((m) => { const val = v.votos[claveU(m.usuario)]; const ya = val !== undefined;
        return { usuario: m.usuario, rol: m.rol, ya, valor: ya && (v.revelada || mismo(m.usuario, me)) ? val : null }; });
      const texto = (f) => (!f.ya ? 'Falta' : f.valor === null ? 'Oculto' : String(f.valor));
      const faltan = filas.filter((f) => !f.ya);
      const miVoto = v.votos[claveU(me)] ?? null;
      cuerpo = `<p class="pk-ronda">Ronda ${v.ronda}</p>
        <ul class="pk-lista">${filas.map((f) => `<li class="pk-int${mismo(f.usuario, me) ? ' is-yo' : ''}"><span class="pk-nombre">${esc(f.usuario)}</span><span class="pk-rol">${ROLES[f.rol]}</span>${f.ya ? '<span class="pk-estado">Ya votó</span>' : ''}<span class="solo-lectores">Voto: </span><strong class="pk-voto" data-v="${texto(f) === 'Falta' ? 'falta' : texto(f) === 'Oculto' ? 'oculto' : 'valor'}">${texto(f)}</strong></li>`).join('')}</ul>`;
      if (!v.revelada) {
        cuerpo += `<p class="pk-consigna">Elegí una carta: ¿cuántos Story Points creés que lleva esta historia?</p>
          <div class="pk-cartas" role="group" aria-label="Cartas de estimación">${CARTAS.map((c) => `<button type="button" class="pk-carta" data-action="poker-vote" data-valor="${c}" aria-pressed="${miVoto === c}"${cer ? ' disabled' : ''}>${c}</button>`).join('')}</div>`;
        cuerpo += sm && !cer
          ? `<div class="pk-acciones"><button type="button" class="btn btn--primary" data-action="poker-reveal"${faltan.length ? ' disabled' : ''}>Revelar</button>${faltan.length ? `<p>Falta votar: ${faltan.map((f) => esc(f.usuario)).join(', ')}</p>` : ''}</div>`
          : `<div class="pk-acciones"><button type="button" class="btn btn--primary" disabled aria-describedby="pk-nota-rev">Revelar</button><p class="nota-rol nota-rol--inline" id="pk-nota-rev">${icon('lock')}${cer ? 'Proyecto cerrado' : 'Solo el Scrum Master puede revelar'}</p></div>`;
      } else {
        const vals = filas.map((f) => f.valor), prom = vals.reduce((a, b) => a + b, 0) / vals.length;
        cuerpo += `<dl class="pk-resultado" aria-label="Resultado de la votación"><div><dt>Promedio exacto</dt><dd>${prom.toLocaleString('es-AR', { maximumFractionDigits: 2 })}</dd></div><div><dt>Carta sugerida</dt><dd>${cartaSugerida(prom)}</dd></div></dl>
          <p>Registrar la estimación acordada se hace en otra historia (HU-14).</p>`;
      }
    }
    return `<section class="pk">${cabecera}${resumen}${cuerpo}</section>`;
  }

  // ---------- Diálogos de confirmación (quitar integrante, cerrar y eliminar proyecto) ----------
  // Viven en #dialog-root (fuera de render()) para conservar el foco; al cerrarse devuelven el foco al botón que los abrió.
  const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  function resumenProyecto(pid) {
    const sp = DB.sprints[pid] || [];
    const hs = (DB.stories[pid] || []).length + sp.reduce((t, x) => t + x.stories.length, 0);
    const hrs = Object.values(DB.horas[pid] || {}).reduce((t, l) => t + l.length, 0);
    return { hs, sp: sp.length, hrs };
  }
  function dlgHtml() {
    const d = ui.dlg; if (!d) return '';
    const p = proyecto(d.pid); let t, c, a;
    const cancelar = '<button type="button" class="btn btn--ghost" data-action="dlg-cancel" data-foco>Cancelar</button>';
    if (d.tipo === 'quitar') {
      t = `¿Quitar a ${esc(d.usuario)} del proyecto?`; c = '<p>Sus votos y horas se conservan.</p>';
      a = cancelar + '<button type="button" class="btn btn--danger" data-action="dlg-quitar-ok">Quitar</button>';
    } else if (d.tipo === 'cerrar') {
      t = '¿Cerrar el proyecto?';
      c = `<p>«${esc(p.nombre)}» queda en estado Finalizado, con fecha de cierre ${fmt(hoyISO())}, y pasa a solo lectura. El Scrum Master puede reabrirlo cuando quiera.</p>`;
      a = cancelar + '<button type="button" class="btn btn--primary" data-action="dlg-cerrar-ok">Cerrar proyecto</button>';
    } else if (d.paso === 1) {
      const z = resumenProyecto(d.pid);
      t = '¿Querés eliminar el proyecto?';
      c = `<p>Vas a perder lo que contiene «${esc(p.nombre)}»:</p><ul class="dlg-lista"><li>${plural(z.hs, 'historia', 'historias')}</li><li>${plural(z.sp, 'Sprint', 'Sprints')}</li><li>${plural(z.hrs, 'registro de horas', 'registros de horas')}</li></ul>`;
      a = cancelar + '<button type="button" class="btn btn--danger-outline" data-action="dlg-eliminar-sig">Continuar</button>';
    } else {
      t = 'Confirmá la eliminación';
      c = `<p>Se borra el proyecto «${esc(p.nombre)}» con todo lo que contiene: historias, Sprints, equipo, votaciones y registros de horas. <strong>No se puede deshacer.</strong></p>
        <div class="field"><label for="del-nombre">Para confirmar, escribí el nombre exacto del proyecto: <strong>${esc(p.nombre)}</strong></label><input id="del-nombre" autocomplete="off" spellcheck="false" data-foco></div>`;
      a = cancelar + '<button type="button" class="btn btn--danger" id="del-ok" data-action="dlg-eliminar-ok" disabled>Eliminar definitivamente</button>';
    }
    return `<div class="overlay" data-dialog><div class="modal dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d"><h2 id="dlg-t">${t}</h2><div id="dlg-d" class="dlg">${c}</div><div class="form-actions">${a}</div></div></div>`;
  }
  function pintarDlg() {
    $('dialog-root').innerHTML = dlgHtml();
    $('shell').inert = true; $('overlay-root').inert = true;
    const f = document.querySelector('#dialog-root [data-foco]'); if (f) f.focus();
  }
  function abrirDlg(d, opener) { ui.dlg = Object.assign({ opener }, d); pintarDlg(); }
  function cerrarDlg(volver) {
    const d = ui.dlg; ui.dlg = null; $('dialog-root').innerHTML = '';
    $('shell').inert = false; $('overlay-root').inert = false;
    if (volver && d && d.opener && document.contains(d.opener)) d.opener.focus();
  }
  const enfocarTitulo = () => { const h = document.querySelector('#view h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } };
  function accionDlg(a, t) {
    const d = ui.dlg, pid = d ? d.pid : null, sm = pid != null && esSM(pid), libre = sm && !cerrado(pid);
    if (a === 'dlg-cancel') { cerrarDlg(true); return; }
    if (a === 'dlg-quitar' || a === 'dlg-cerrar' || a === 'dlg-eliminar') { // abrir
      const id = parse().id; if (!esSM(id) || (a !== 'dlg-eliminar' && cerrado(id))) return;
      abrirDlg(a === 'dlg-quitar' ? { tipo: 'quitar', pid: id, usuario: t.dataset.user } : a === 'dlg-cerrar' ? { tipo: 'cerrar', pid: id } : { tipo: 'eliminar', paso: 1, pid: id }, t); return;
    }
    if (!d) return;
    if (a === 'dlg-quitar-ok') {
      if (!libre) return;
      DB.team[pid] = DB.team[pid].filter((m) => m.rol === 'scrum_master' || !mismo(m.usuario, d.usuario)); // votos y horas no se tocan
      cerrarDlg(false); render(); toast(`${d.usuario} ya no es parte del proyecto`);
      const sel = $('m-user'); if (sel && !sel.disabled) sel.focus(); else enfocarTitulo();
    } else if (a === 'dlg-cerrar-ok') {
      if (!libre) return;
      proyecto(pid).cerrado = hoyISO(); cerrarDlg(false); render(); toast('Proyecto cerrado');
      const b = document.querySelector('[data-action="reabrir"]'); if (b) b.focus(); else enfocarTitulo();
    } else if (a === 'dlg-eliminar-sig') { if (!sm) return; d.paso = 2; pintarDlg(); }
    else if (a === 'dlg-eliminar-ok') {
      const p = proyecto(pid); if (!sm || !p || $('del-nombre').value !== p.nombre) return;
      DB.projects = DB.projects.filter((x) => x.id !== pid);
      [DB.team, DB.stories, DB.sprints, DB.votaciones, DB.horas].forEach((m) => { delete m[pid]; });
      cerrarDlg(false); ui.avisoHome = `El proyecto «${p.nombre}» (#${pid}) se eliminó definitivamente.`;
      navigate('#/projects', true); toast(`Proyecto «${p.nombre}» eliminado`); enfocarTitulo();
    }
  }

  // ---------- Pantallas de error ----------
  function viewNoMiembro() {
    return `<section class="estado-vacio"><span class="ic">${icon('lock')}</span><h1>No sos integrante de este proyecto</h1><p class="sub">Pedile al Scrum Master que te agregue al equipo.</p><a class="btn btn--primary" href="#/projects">${icon('back')}Ir a mis proyectos</a></section>`;
  }
  function viewSinPermiso(r) {
    return `<section class="estado-vacio"><span class="ic">${icon('lock')}</span><h1>No tenés permiso para esta acción</h1><p class="sub">Esta acción solo la puede realizar el Scrum Master del proyecto.</p>${r.id ? `<a class="btn btn--primary" href="#/projects/${r.id}/proyecto">${icon('back')}Volver al panel</a>` : `<a class="btn btn--primary" href="#/projects">${icon('back')}Ir a mis proyectos</a>`}</section>`;
  }

  // ---------- Render ----------
  function render() {
    const r = parse();
    const auth = r.name === 'login' || r.name === 'register';
    $('shell').hidden = auth; $('auth').hidden = !auth;
    if (auth) {
      $('auth').innerHTML = viewAuth(r); $('overlay-root').innerHTML = '';
      document.title = 'Métrica · ' + (r.name === 'login' ? 'Iniciar sesión' : 'Crear cuenta');
      setTimeout(() => { const i = document.querySelector('.auth input'); if (i) i.focus(); }, 30);
      return;
    }
    $('shell').classList.toggle('drawer-open', ui.drawer);
    $('sidebar').innerHTML = sidebar(r);
    $('topbar').innerHTML = topbar(r);
    const tb = $('tabbar'); tb.innerHTML = tabbar(r); tb.classList.toggle('show', r.name === 'project');
    let v = '', ov = '';
    if (r.name === 'home') { v = viewHome(); if (r.modal) ov = overlayCrear(); }
    else if (r.name === 'nomember') v = viewNoMiembro(r);
    else if (r.name === 'forbidden') v = viewSinPermiso(r);
    else if (r.sec === 'edit') v = viewEditar(r);
    else if (r.sec === 'settings') v = viewEquipo(r);
    else if (r.sec === 'backlog') { v = viewBacklog(r); if (r.sub === 'nueva' && !cerrado(r.id)) ov = overlayNuevaHistoria(r); }
    else if (r.sec === 'sprints') v = viewSprints(r);
    else if (r.sec === 'status') v = viewEstado(r);
    else if (r.sec === 'votacion') v = viewVotacion(r);
    else v = viewPanel(r);
    $('view').innerHTML = v;
    $('overlay-root').innerHTML = ov;
    if (r.name === 'home') renderLista();
    document.title = 'Métrica · ' + (r.name === 'project' ? proyecto(r.id).nombre : 'Proyectos');
    if (ov) setTimeout(() => { const i = document.querySelector('[data-overlay] input'); if (i) i.focus(); }, 30);
  }

  const cerrarOverlay = () => { const r = parse(); navigate(r.name === 'project' ? `#/projects/${r.id}/backlog` : '#/projects'); };

  // ---------- Acciones ----------
  const enfocarPanel = () => setTimeout(() => { const i = document.querySelector('.inline-panel input, .inline-panel select, .inline-panel textarea'); if (i) i.focus(); }, 30);
  document.addEventListener('click', (e) => {
    // Diálogos: clic afuera cierra, salvo en el último paso de eliminar (ahí solo Cancelar o Esc)
    if (e.target.matches('[data-dialog]')) { if (ui.dlg && ui.dlg.paso !== 2) cerrarDlg(true); return; }
    // cerrar el desplegable de proyectos al hacer clic afuera
    if (ui.menu && !e.target.closest('.switcher')) { ui.menu = false; const sw = document.querySelector('.switcher'); if (sw) { sw.classList.remove('is-open'); sw.querySelector('.switcher-menu').hidden = true; } }
    if (ui.userMenu && !e.target.closest('.usermenu')) { ui.userMenu = false; const m = document.querySelector('.umenu'); if (m) m.hidden = true; const b = document.querySelector('.ubtn'); if (b) b.setAttribute('aria-expanded', 'false'); }
    if (e.target.matches('[data-overlay]')) { cerrarOverlay(); return; }

    const a0 = e.target.closest('a[href^="#/"]');
    if (a0 && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) { e.preventDefault(); navigate(a0.getAttribute('href')); return; }

    const t = e.target.closest('[data-action]'); if (!t || t.disabled) return;
    const r = parse(), pid = r.id, a = t.dataset.action;
    if (a.startsWith('dlg-')) { accionDlg(a, t); return; }
    const MUT = ['open-edit', 'open-assign', 'open-horas', 'create-sprint', 'story-next', 'close-sprint', 'poker-start', 'poker-vote', 'poker-reveal'];
    if (MUT.includes(a) && cerrado(pid)) { toast('Proyecto cerrado'); return; } // proyecto cerrado = solo lectura
    if (a === 'toggle-menu') { ui.menu = !ui.menu; const sw = document.querySelector('.switcher'); sw.classList.toggle('is-open', ui.menu); sw.querySelector('.switcher-menu').hidden = !ui.menu; sw.querySelector('.switcher-btn').setAttribute('aria-expanded', ui.menu); }
    else if (a === 'toggle-drawer') { ui.drawer = !ui.drawer; $('shell').classList.toggle('drawer-open', ui.drawer); }
    else if (a === 'close-drawer') { ui.drawer = false; $('shell').classList.remove('drawer-open'); }
    else if (a === 'toggle-user') { ui.userMenu = !ui.userMenu; const m = document.querySelector('.umenu'); m.hidden = !ui.userMenu; t.setAttribute('aria-expanded', ui.userMenu); }
    else if (a === 'logout') doLogout();
    else if (a === 'toggle-pw') { const inp = t.parentElement.querySelector('input'), show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; t.innerHTML = icon(show ? 'eyeoff' : 'eye'); t.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña'); }
    // --- solo del prototipo ---
    else if (a === 'load-demo') {
      const u0 = $('l-user') ? $('l-user').value : '', p0 = $('l-pass') ? $('l-pass').value : '';
      const res = cargarDemo(); render();
      if ($('l-user')) { $('l-user').value = u0; $('l-pass').value = p0; }
      if (res.choque) { const av = $('demo-aviso'); av.textContent = `No se pueden cargar los datos de prueba: ya existe el usuario «${res.choque}».`; av.hidden = false; }
      else toast('Datos de prueba cargados: ya podés ingresar con los usuarios de la lista');
    } else if (a === 'use-demo') { $('l-user').value = t.dataset.user; $('l-pass').value = DEMO_PASS; document.querySelectorAll('.field.invalid').forEach((f) => f.classList.remove('invalid')); $('auth-alert').hidden = true; document.querySelector('form[data-form=login] button[type=submit]').focus(); }
    else if (a === 'switch-user') {
      const u = DB.users.find((x) => mismo(x.usuario, t.dataset.user));
      if (u && !mismo(u.usuario, session.usuario)) { session = u; ui.userMenu = false; ui.panel = null; render(); toast(`Ahora actuás como ${u.usuario} (solo del prototipo)`); }
    } else if (a === 'expire') { ui.volverA = route; ui.expired = true; session = null; navigate('#/login'); }
    else if (a === 'demo-403') navigate('#/forbidden');
    // --- Planning Poker ---
    else if (a === 'poker-start') { if (!esSM(pid)) return; const m = DB.votaciones[pid] || (DB.votaciones[pid] = {}); if (!m[r.hid]) m[r.hid] = { ronda: 1, revelada: false, votos: {} }; render(); }
    else if (a === 'poker-vote') {
      const v = (DB.votaciones[pid] || {})[r.hid]; if (!v || v.revelada) return;
      v.votos[claveU(session.usuario)] = Number(t.dataset.valor); render();
      const b = document.querySelector(`.pk-carta[data-valor="${t.dataset.valor}"]`); if (b) b.focus();
    } else if (a === 'poker-reveal') {
      const v = (DB.votaciones[pid] || {})[r.hid];
      if (!v || v.revelada || !esSM(pid) || (DB.team[pid] || []).some((m) => v.votos[claveU(m.usuario)] === undefined)) return;
      v.revelada = true; render();
    } else if (a === 'poker-refresh') { render(); toast('Votación actualizada'); }
    // --- quitar / cerrar / eliminar ---
    else if (a === 'cerrar-aviso') { ui.avisoHome = null; render(); }
    else if (a === 'reabrir') { if (!esSM(pid)) return; delete proyecto(pid).cerrado; render(); toast('Proyecto reabierto'); const b = document.querySelector('[data-action="dlg-cerrar"]'); if (b) b.focus(); else enfocarTitulo(); }
    // --- resto ---
    else if (a === 'close-overlay') cerrarOverlay();
    else if (a === 'open-edit' || a === 'open-assign') { ui.panel = { type: a === 'open-edit' ? 'edit' : 'assign', story: Number(t.dataset.story) }; render(); enfocarPanel();
    } else if (a === 'open-horas') { ui.panel = { type: 'horas', story: Number(t.dataset.story) }; render(); enfocarPanel();
    } else if (a === 'close-panel') { ui.panel = null; render();
    } else if (a === 'create-sprint') {
      if (!esSM(pid)) return;
      const l = DB.sprints[pid], n = Math.max(0, ...l.map((s) => s.numero)) + 1;
      l.push({ numero: n, goal: '', inicio: '', fin: '', estado: 'pendiente', stories: [] }); render(); toast(`Sprint ${n} creado`);
    } else if (a === 'story-next') {
      const s = DB.sprints[pid].find((x) => x.numero === Number(t.dataset.sprint)), h = s.stories.find((x) => x.id === Number(t.dataset.story));
      if (h.estado === 'Nueva') h.estado = 'En progreso'; else if (h.estado === 'En progreso') { h.estado = 'Completada'; h.fecha = hoyISO(); }
      render();
    } else if (a === 'close-sprint') { if (!esSM(pid)) return; DB.sprints[pid].find((x) => x.numero === Number(t.dataset.sprint)).estado = 'finalizado'; render(); }
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (ui.dlg) { cerrarDlg(true); return; } if (ui.userMenu) { ui.userMenu = false; const m = document.querySelector('.umenu'); if (m) m.hidden = true; return; } if (document.querySelector('[data-overlay]')) cerrarOverlay(); else if (ui.drawer) { ui.drawer = false; $('shell').classList.remove('drawer-open'); } } });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'del-nombre' && ui.dlg) { $('del-ok').disabled = e.target.value !== proyecto(ui.dlg.pid).nombre; return; }
    if (e.target.id === 'buscar') renderLista();
    const f = e.target.closest('.field.invalid'); if (f) f.classList.remove('invalid');
    const al = $('auth-alert'); if (al) al.hidden = true;
  });

  // Envío de formularios: no depende del evento nativo "submit" (algunos visores/iframes con sandbox lo bloquean).
  function enviar(f) {
    const r = parse(), pid = r.id, kind = f.dataset.form;
    const fechas = (i, fi) => { const finMal = !fi || (i && fi < i); return [finMal, !fi ? 'Elegí la fecha de fin.' : 'La fecha de fin no puede ser anterior al inicio.']; };
    if (['edit-project', 'team', 'new-story', 'edit-story', 'assign', 'hours', 'start-sprint'].includes(kind) && cerrado(pid)) { toast('Proyecto cerrado'); return; }
    // Acciones exclusivas del Scrum Master: si llegara un envío de otro rol, se muestra "No tenés permiso"
    if (['edit-project', 'team', 'start-sprint'].includes(kind) && !esSM(pid)) { navigate('#/forbidden'); return; }

    if (kind === 'login') { doLogin(); return; }
    if (kind === 'register') { doRegister(); return; }
    if (kind === 'create-project') {
      const v = { n: val('c-nombre'), i: $('c-inicio').value, f: $('c-fin').value };
      setInvalid('f-nombre', !v.n); setInvalid('f-inicio', !v.i);
      const [finMal, msg] = fechas(v.i, v.f); setInvalid('f-fin', finMal, msg);
      if (!v.n || !v.i || finMal) return;
      const p = { id: DB.nextProject++, nombre: v.n, descripcion: val('c-desc'), inicio: v.i, fin: v.f };
      DB.projects.push(p); DB.team[p.id] = [{ usuario: session.usuario, rol: 'scrum_master' }]; DB.stories[p.id] = []; DB.sprints[p.id] = [];
      navigate(`#/projects/${p.id}/proyecto`); toast(`Proyecto "${p.nombre}" creado (#${p.id})`);
    } else if (kind === 'edit-project') {
      const p = proyecto(pid), v = { n: val('e-nombre'), i: $('e-inicio').value, f: $('e-fin').value };
      setInvalid('f-nombre', !v.n); setInvalid('f-inicio', !v.i);
      const [finMal, msg] = fechas(v.i, v.f); setInvalid('f-fin', finMal, msg);
      if (!v.n || !v.i || finMal) return;
      Object.assign(p, { nombre: v.n, descripcion: val('e-desc'), inicio: v.i, fin: v.f });
      navigate(`#/projects/${pid}/proyecto`); toast('Cambios guardados');
    } else if (kind === 'team') {
      const u = $('m-user').value; setInvalid('f-m-user', !u, 'Elegí un usuario.');
      if (!u || miembro(pid, u)) return;
      DB.team[pid].push({ usuario: u, rol: 'product_builder' }); render(); toast(`${u} se sumó al equipo como Product Builder`);
    } else if (kind === 'new-story') {
      const t = val('n-t'); setInvalid('f-hist', !t); if (!t) return;
      DB.stories[pid].push({ id: DB.nextStory++, titulo: t, descripcion: val('n-d'), criterios: val('n-c'), prioridad: $('n-p').value, valor: $('n-v').value ? Number($('n-v').value) : null, sp: null });
      navigate(`#/projects/${pid}/backlog`); toast('Historia creada');
    } else if (kind === 'edit-story') {
      const h = DB.stories[pid].find((x) => x.id === Number(f.dataset.story)), t = val('x-t');
      setInvalid('f-hist', !t); if (!t) return;
      Object.assign(h, { titulo: t, descripcion: val('x-d'), criterios: val('x-c'), sp: $('x-sp').value ? Number($('x-sp').value) : null });
      ui.panel = null; render(); toast('Historia actualizada');
    } else if (kind === 'assign') {
      const n = Number($('a-sprint').value);
      if (!n) { $('a-sprint').closest('.field').classList.add('invalid'); return; }
      const lista = DB.stories[pid], i = lista.findIndex((x) => x.id === Number(f.dataset.story)), h = lista.splice(i, 1)[0];
      DB.sprints[pid].find((s) => s.numero === n).stories.push({ id: h.id, titulo: h.titulo, prioridad: h.prioridad, sp: h.sp, estado: 'Nueva' });
      ui.panel = null; render(); toast(`Historia asignada al Sprint ${n}`);
    } else if (kind === 'hours') {
      const fecha = $('h-fecha').value, act = val('h-act'), horas = Number($('h-horas').value);
      const horasMal = !(horas > 0);
      setInvalid('f-h-fecha', !fecha); setInvalid('f-h-act', !act); setInvalid('f-h-horas', horasMal);
      if (!fecha || !act || horasMal) return;
      const hid = Number(f.dataset.story), m = DB.horas[pid] || (DB.horas[pid] = {});
      (m[hid] || (m[hid] = [])).push({ fecha, actividad: act, horas, usuario: session.usuario }); // se registra a nombre de la persona logueada
      ui.panel = null; render(); toast(`Horas registradas a nombre de ${session.usuario}`);
    } else if (kind === 'start-sprint') { toast('Iniciar Sprint no está simulado en este prototipo'); }
  }
  document.addEventListener('submit', (e) => { e.preventDefault(); const f = e.target.closest('form[data-form]'); if (f) enviar(f); });
  // Botón "enviar" y tecla Enter llaman directo a enviar() (y evitan el envío nativo para no duplicar).
  document.addEventListener('click', (e) => {
    const sb = e.target.closest('button[type=submit]');
    if (sb && sb.form && sb.form.dataset.form && !sb.disabled) { e.preventDefault(); enviar(sb.form); }
  });
  document.addEventListener('keydown', (e) => {
    if (!ui.dlg) return;
    if (e.key === 'Enter' && e.target.id === 'del-nombre') { e.preventDefault(); const b = $('del-ok'); if (b && !b.disabled) b.click(); return; }
    if (e.key !== 'Tab') return;
    const fs = [...document.querySelectorAll('#dialog-root input, #dialog-root button:not(:disabled)')]; if (!fs.length) return;
    const i = fs.indexOf(document.activeElement), n = fs.length;
    if (e.shiftKey && i <= 0) { e.preventDefault(); fs[n - 1].focus(); } else if (!e.shiftKey && (i === n - 1 || i < 0)) { e.preventDefault(); fs[0].focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (ui.dlg) return;
    if (e.key !== 'Enter' || e.isComposing) return;
    const t = e.target; if (!t.matches || !t.matches('input:not([type=button]):not([type=checkbox]), select')) return;
    const f = t.closest('form[data-form]'); if (f && !t.closest('fieldset:disabled')) { e.preventDefault(); enviar(f); }
  });

  const desdeUrl = () => { if (ui.dlg) cerrarDlg(false); route = location.hash || '#/projects'; ui.panel = null; ui.menu = false; ui.drawer = false; render(); window.scrollTo(0, 0); };
  window.addEventListener('popstate', desdeUrl);
  window.addEventListener('hashchange', desdeUrl);
  render();
})();
</script>
</body>
</html>
