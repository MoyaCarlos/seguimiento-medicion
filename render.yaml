# SOLO REFERENCIA versionada de la configuración del servicio en Render (Issue #139).
# El servicio se creó a mano en el dashboard y se administra ahí.
# NO crear un Blueprint a partir de este archivo: Render lo aplicaría al servicio
# existente y lo sincronizaría con cada push. Render recomienda declarar todas las
# opciones del servicio: algunas omitidas se conservan (por ejemplo plan o
# autoDeployTrigger), pero buildFilter se reemplaza por listas vacías (acá sí está
# declarado) y de otros campos su documentación no aclara qué pasa.
# Si cambia el dashboard, actualizar este archivo y el README.
# Detalle en specs/026-render-despliegue/.
services:
  - type: web
    name: seguimiento-medicion-sprintometro
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DEMO_HABILITADO
        value: "true"
    buildFilter:
      ignoredPaths:
        - docs/**
        - specs/**
        - features/**
        - "**/*.md"
        - .github/**
        - .specify/**
        - render.yaml
