# SOLO REFERENCIA versionada de la configuración del servicio en Render (Issue #139).
# El servicio se creó a mano en el dashboard y se administra ahí.
# NO crear un Blueprint a partir de este archivo: Render lo aplicaría al servicio
# existente, lo sincronizaría con cada push y lo que acá no esté declarado podría
# volver a su valor por defecto (en particular buildFilter, que se reemplaza por listas vacías). Si cambia el dashboard, actualizar este archivo y el README.
# Detalle en specs/026-render-despliegue/.
services:
  - type: web
    name: seguimiento-medicion-sprintometro
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DEMO_HABILITADO
        value: "true"
    buildFilter:
      ignoredPaths:
        - docs/**
        - specs/**
        - features/**
        - "**/*.md"
        - .github/**
        - .specify/**
        - render.yaml
