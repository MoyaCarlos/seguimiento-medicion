openapi: 3.0.3
info:
  title: Software Metrics & Estimation API — Imputación de Horas Trabajadas (HU-07)
  version: 1.0.0
  description: >-
    Contrato de la imputación de horas a una historia del Sprint activo y de la
    consulta de su esfuerzo real. Las horas se reciben en horas decimales, se
    guardan como minutos enteros y se devuelven en las dos unidades. Las cargas
    no se editan ni se borran.
paths:
  /backlog/{id}/horas:
    post:
      summary: Imputar horas trabajadas a una historia
      description: >-
        Registra una carga atribuida al Sprint Activo al que pertenece la
        historia en ese momento. Orden de evaluación de los errores: id de ruta
        inválido, historia inexistente (404), cuerpo que no es JSON, historia
        fuera del Sprint activo, integrante ajeno al proyecto, horas, actividad,
        fecha (400).
      operationId: imputarHoras
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImputarHorasRequest'
            examples:
              cuatroHoras:
                value:
                  integrante_id: 2
                  fecha: '2026-10-28'
                  actividad: Implementar el handler de horas
                  horas: 4
              horaYMedia:
                value:
                  integrante_id: 2
                  fecha: '2026-10-27'
                  actividad: Revisión del PR
                  horas: 1.5
      responses:
        '201':
          description: Carga registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroHoras'
              examples:
                cuatroHoras:
                  value:
                    id: 10
                    historia_id: 3
                    sprint_id: 1
                    integrante_id: 2
                    integrante: Ana
                    fecha: '2026-10-28'
                    actividad: Implementar el handler de horas
                    minutos: 240
                    horas: 4
        '400':
          description: >-
            Id de ruta inválido, cuerpo que no es JSON, historia fuera del
            Sprint activo, integrante ajeno al proyecto, o horas, actividad o
            fecha inválidas. `campo` identifica el dato con problemas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fueraDelSprint:
                  value: { campo: historia_id, mensaje: solo se imputan horas a historias del Sprint activo }
                integranteAjeno:
                  value: { campo: integrante_id, mensaje: el integrante no pertenece al proyecto de la historia }
                horasNegativas:
                  value: { campo: horas, mensaje: las horas deben ser mayores que cero }
                horasNoNumericas:
                  value: { campo: horas, mensaje: las horas deben ser un número }
                actividadVacia:
                  value: { campo: actividad, mensaje: la actividad es obligatoria }
                fechaFutura:
                  value: { campo: fecha, mensaje: la fecha no puede ser posterior a hoy }
        '404':
          description: La historia no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { mensaje: historia no encontrada }
        '409':
          description: Violación de integridad referencial (red de seguridad; no debería ocurrir).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Consultar el esfuerzo real de una historia
      description: >-
        Devuelve el total acumulado y el detalle de las cargas, ordenado por
        fecha trabajada y, a igual fecha, por orden de carga.
      operationId: consultarEsfuerzoReal
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Esfuerzo real (total 0 y lista vacía si no hay cargas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsfuerzoReal'
              examples:
                conCargas:
                  value:
                    historia_id: 3
                    total_minutos: 330
                    total_horas: 5.5
                    registros:
                      - id: 10
                        historia_id: 3
                        sprint_id: 1
                        integrante_id: 2
                        integrante: Ana
                        fecha: '2026-10-27'
                        actividad: Revisión del PR
                        minutos: 90
                        horas: 1.5
                      - id: 11
                        historia_id: 3
                        sprint_id: 1
                        integrante_id: 4
                        integrante: Jimena
                        fecha: '2026-10-28'
                        actividad: Implementar el handler de horas
                        minutos: 240
                        horas: 4
                sinCargas:
                  value:
                    historia_id: 5
                    total_minutos: 0
                    total_horas: 0
                    registros: []
        '400':
          description: Id de ruta inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La historia no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { mensaje: historia no encontrada }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Identificador de la historia.
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    ImputarHorasRequest:
      type: object
      required: [integrante_id, fecha, actividad, horas]
      properties:
        integrante_id:
          type: integer
          format: int64
          description: Id del usuario integrante del proyecto de la historia.
        fecha:
          type: string
          format: date
          description: Día trabajado, AAAA-MM-DD. Entre el inicio del Sprint activo y la menor entre hoy y su fin, ambos inclusive.
        actividad:
          type: string
          maxLength: 500
          description: Obligatoria; se recortan los espacios externos.
        horas:
          description: >-
            Horas trabajadas, con decimales (1.5 = 90 minutos). Mayor que 0, a
            lo sumo 24, y deben dar un número entero de minutos. Un string no
            numérico se rechaza con un error sobre `horas`.
          oneOf:
            - type: number
            - type: string
    RegistroHoras:
      type: object
      properties:
        id: { type: integer, format: int64 }
        historia_id: { type: integer, format: int64 }
        sprint_id: { type: integer, format: int64 }
        integrante_id: { type: integer, format: int64 }
        integrante:
          type: string
          description: Nombre del integrante.
        fecha: { type: string, format: date }
        actividad: { type: string }
        minutos:
          type: integer
          description: Duración exacta, como se guarda.
        horas:
          type: number
          description: minutos / 60, solo para mostrar.
    EsfuerzoReal:
      type: object
      properties:
        historia_id: { type: integer, format: int64 }
        total_minutos: { type: integer }
        total_horas: { type: number }
        registros:
          type: array
          items:
            $ref: '#/components/schemas/RegistroHoras'
    Error:
      type: object
      required: [mensaje]
      properties:
        campo: { type: string }
        mensaje: { type: string }
